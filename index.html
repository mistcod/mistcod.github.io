<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Example HTML Page</title>
</head>
<body>
   <!-- Main Heading -->
   <h1>Welcome to My Website</h1>
   <!-- Paragraph with emphasized text -->
   <p>This is an example of a <strong>basic HTML page</strong>. HTML is used to structure content on the web.</p>
   <!-- Unordered List -->
   <h2>Features:</h2>
   <ul>
       <li>Simple and easy to learn</li>
       <li>Widely used for web development</li>
       <li>Supports multimedia elements</li>
   </ul>
   <!-- Image with alt text -->
   <h2>Sample Image:</h2>
   <img src="https://via.placeholder.com/150" alt="Placeholder Image">
   <!-- Hyperlink -->
   <h2>Learn More:</h2>
   <a href="https://www.w3schools.com/html/" target="_blank">Visit W3Schools for HTML Tutorials</a>
   <!-- Form Example -->
   <h2>Contact Us:</h2>
   <form action="/submit" method="POST">
       <label for="name">Name:</label>
       <input type="text" id="name" name="name" required>
       <br>
       <label for="email">Email:</label>
       <input type="email" id="email" name="email" required>
       <br>
       <input type="submit" value="Submit">
   </form>
</body>
</html>
